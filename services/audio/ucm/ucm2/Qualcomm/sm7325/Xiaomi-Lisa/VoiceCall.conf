# Modem calls on Xiaomi 11 Lite 5G NE (lisa).
# The ADSP mixes voice directly via APR Q6Voice (MVM/CVP/CVS) between the
# modem and Primary TDM (TFA9873) / TX_CODEC_DMA_TX_3 (WCD9385).
# PCM 2 (VoiceMMode1) is the hostless voice endpoint.

SectionVerb {
	EnableSequence [
		cset "name='Left SmartPA Mute' 1,1"
		cset "name='Left TFA Profile' handset"
		cset "name='VoiceMMode1 TX Topology' 69488"
		cset "name='PRIMARY_TDM_RX_0 Voice Mixer VoiceMMode1' on"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' on"
	]

	DisableSequence [
		cset "name='Left SmartPA Mute' 1,1"
		cset "name='PRIMARY_TDM_RX_0 Voice Mixer VoiceMMode1' off"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' off"
	]

	Value {
		TQ "Voice"
		Priority 1000
	}
}

SectionDevice."Earpiece" {
	Comment "Handset earpiece"

	EnableSequence [
		cset "name='Left SmartPA Mute' 1,1"
		cset "name='Left TFA Profile' handset"
		cset "name='Left SmartPA Mute' 0,0"
	]

	DisableSequence [
		cset "name='Left SmartPA Mute' 1,1"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Handset microphone"

	EnableSequence [
		cset "name='ADC1 Volume' 10"
		cset "name='ADC1 Switch' on"
		cset "name='ADC1_MIXER Switch' on"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' on"
		cset "name='TX_AIF1 Capture Switch' on"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' off"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1_MIXER Switch' off"
		cset "name='ADC1 Switch' off"
		cset "name='ADC1 Volume' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
		CaptureSwitch "name='TX_AIF1 Capture Switch'"
	}
}
