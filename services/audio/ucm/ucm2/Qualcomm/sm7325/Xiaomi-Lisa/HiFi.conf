SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='ADC1 Volume' 10"
		cset "name='ADC1 Switch' on"
		cset "name='ADC1_MIXER Switch' on"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX_AIF1_CAP Mixer DEC0' on"
		cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' on"
	]

	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CODEC_DMA_TX_3' off"
		cset "name='TX_AIF1_CAP Mixer DEC0' off"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1_MIXER Switch' off"
		cset "name='ADC1 Switch' off"
		cset "name='ADC1 Volume' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureMixerElem "ADC1"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers"

	EnableSequence [
		cset "name='Left SmartPA Mute' 1,1"
		cset "name='Left TFA Profile' stereo"
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' on"
		cset "name='Left SmartPA Mute' 0,0"
	]

	DisableSequence [
		cset "name='Left SmartPA Mute' 1,1"
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
