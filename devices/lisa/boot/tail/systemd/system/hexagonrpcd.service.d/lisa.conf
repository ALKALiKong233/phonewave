[Service]
# Kodiak's ADSP is qcom,non-secure-domain: the kernel exposes only this
# endpoint. -s still attaches to the existing sensors protection domain.
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /run/hexagonrpcd
DeviceAllow=
DeviceAllow=/dev/fastrpc-adsp rw
BindPaths=
BindPaths=/dev/fastrpc-adsp
