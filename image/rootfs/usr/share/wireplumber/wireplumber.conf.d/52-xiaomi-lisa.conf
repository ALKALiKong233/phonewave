# The protected TFA9873 TDM path consumes 48 kHz S16_LE stereo, not the
# eight AUX channels advertised by the MultiMedia1 frontend.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" api.alsa.card.name = "Xiaomi-Lisa" } ]
    actions = {
      update-props = {
        device.profile = "HiFi"
        # Linear gain 0.008 is 20% on the cubic desktop volume scale.
        device.routes.default-sink-volume = 0.008
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" alsa.card_name = "Xiaomi-Lisa" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ "FL", "FR" ]
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_.*\\.platform-sound\\.Voice_Call__.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.always-process = true
      }
    }
  }
]
